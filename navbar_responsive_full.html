<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* ============================================================
     VARIABEL — ubah di sini saja kalau mau ganti warna/ukuran
     ============================================================ */
  :root {
    --nav-height: 56px;
    --nav-breakpoint: 640px; /* titik batas desktop ↔ mobile */
  }

  /* ============================================================
     NAVBAR SHELL
     position: sticky → navbar ikut scroll tapi tidak hilang
     z-index: 100     → selalu di atas konten lain
     ============================================================ */
  .navbar {
    height: var(--nav-height);
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--color-background-primary);
    border-bottom: 0.5px solid var(--color-border-tertiary);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .navbar__logo {
    font-size: 15px;
    font-weight: 500;
    color: var(--color-text-primary);
    letter-spacing: -0.01em;
    cursor: pointer;
    text-decoration: none;
  }

  /* ============================================================
     DESKTOP NAV LINKS
     Default (tanpa media query) = desktop = tampil
     Di dalam media query mobile = disembunyikan
     ============================================================ */
  .nav-links {
    display: flex; /* DEFAULT: tampil di desktop */
    align-items: center;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    font-size: 13px;
    font-weight: 400;
    color: var(--color-text-secondary);
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
    transition: color 0.2s;
  }

  /* Garis bawah yang tumbuh dari kiri — hover effect desktop */
  .nav-links a::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0; /* mulai dari nol */
    height: 1px;
    background: var(--color-text-primary);
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-links a:hover {
    color: var(--color-text-primary);
  }
  .nav-links a:hover::after,
  .nav-links a.active::after {
    width: 100%;
  } /* tumbuh jadi penuh */
  .nav-links a.active {
    color: var(--color-text-primary);
    font-weight: 500;
  }

  /* ============================================================
     HAMBURGER BUTTON
     Default = tersembunyi di desktop
     Muncul hanya di mobile (lewat media query)
     ============================================================ */
  .hamburger {
    display: none; /* DEFAULT: sembunyi di desktop */
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    background: none;
    border: none;
    border-radius: 6px;
    padding: 4px;
    transition: background 0.15s;
  }
  .hamburger:hover {
    background: var(--color-background-secondary);
  }

  .bar {
    display: block;
    width: 18px;
    height: 1px;
    background: var(--color-text-primary);
    border-radius: 1px;
    transform-origin: center;
    transition:
      transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
      opacity 0.2s ease;
  }

  /* Animasi hamburger → × saat menu terbuka */
  .is-open .bar:nth-child(1) {
    transform: translateY(5px) rotate(45deg);
  }
  .is-open .bar:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
  }
  .is-open .bar:nth-child(3) {
    transform: translateY(-5px) rotate(-45deg);
  }

  /* ============================================================
     MOBILE DROPDOWN PANEL
     Selalu ada di DOM, tapi di desktop tidak relevan
     (nav-links yang tampil, bukan ini)

     translateY(-8px) + opacity:0 = posisi awal tersembunyi
     Saat .is-open → turun ke posisi normal, opacity:1
     ============================================================ */
  .mobile-menu {
    position: absolute;
    top: var(--nav-height);
    left: 0;
    right: 0;
    background: var(--color-background-primary);
    border-bottom: 0.5px solid var(--color-border-tertiary);
    transform: translateY(-8px);
    opacity: 0;
    pointer-events: none;
    transition:
      transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
      opacity 0.25s ease;
    z-index: 99;
  }

  /* Hanya aktifkan saat .is-open DAN di mobile */
  .is-open .mobile-menu {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .mobile-menu__item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
    height: 52px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
  }
  .mobile-menu__item:last-child {
    border-bottom: none;
  }
  .mobile-menu__item:hover {
    background: var(--color-background-secondary);
  }

  .item-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .item-num {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--color-text-tertiary);
    width: 20px;
  }
  .item-label {
    font-size: 14px;
    color: var(--color-text-primary);
  }
  .mobile-menu__item.active .item-label {
    font-weight: 500;
  }
  .mobile-menu__item.active {
    border-left: 1.5px solid var(--color-text-primary);
  }

  .item-arrow {
    width: 14px;
    height: 14px;
    color: var(--color-text-tertiary);
    transition:
      transform 0.2s,
      color 0.15s;
    flex-shrink: 0;
  }
  .mobile-menu__item:hover .item-arrow {
    transform: translateX(2px);
    color: var(--color-text-secondary);
  }

  /* ============================================================
     MEDIA QUERY — INI INTI DARI RESPONSIVE NAVBAR
     Semua yang di dalam blok ini hanya berlaku
     saat lebar layar ≤ 640px
     ============================================================ */
  @media (max-width: 640px) {
    /* Sembunyikan nav links horizontal */
    .nav-links {
      display: none;
    }

    /* Tampilkan tombol hamburger */
    .hamburger {
      display: flex;
    }
  }

  /* ============================================================
     DEMO WRAPPER (bukan bagian navbar — hanya untuk preview)
     ============================================================ */
  .demo-wrap {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
  }
  .demo-content {
    padding: 2rem 1.5rem;
    min-height: 180px;
  }
  .demo-content p {
    font-size: 13px;
    color: var(--color-text-tertiary);
    line-height: 1.6;
  }
  .active-page {
    font-size: 22px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin-bottom: 8px;
  }

  .resize-hint {
    text-align: center;
    font-size: 11px;
    color: var(--color-text-tertiary);
    padding: 8px;
    font-family: var(--font-mono);
    border-top: 0.5px solid var(--color-border-tertiary);
  }

  /* Simulasi mobile: wrapper sempit */
  .view-mobile .nav-links {
    display: none !important;
  }
  .view-mobile .hamburger {
    display: flex !important;
  }
</style>

<div class="demo-wrap" id="demoWrap">
  <!-- =====================================================
       NAVBAR — copy bagian ini ke proyekmu
       ===================================================== -->
  <div class="navbar-wrapper" id="navWrapper">
    <nav class="navbar">
      <!-- Logo -->
      <a class="navbar__logo" href="#">Ghufi.</a>

      <!-- DESKTOP: link horizontal biasa -->
      <ul class="nav-links" id="desktopLinks">
        <li><a href="#" class="active" data-page="Home">Home</a></li>
        <li><a href="#" data-page="About">About</a></li>
        <li><a href="#" data-page="Skills">Skills</a></li>
        <li><a href="#" data-page="Portfolio">Portfolio</a></li>
        <li><a href="#" data-page="Kontak">Kontak</a></li>
      </ul>

      <!-- MOBILE: tombol hamburger -->
      <button
        class="hamburger"
        id="hamburgerBtn"
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <!-- MOBILE: panel dropdown -->
      <div class="mobile-menu" id="mobileMenu" role="navigation">
        <a class="mobile-menu__item active" href="#" data-page="Home">
          <div class="item-left">
            <span class="item-num">01</span>
            <span class="item-label">Home</span>
          </div>
          <svg
            class="item-arrow"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 4l4 4-4 4" />
          </svg>
        </a>
        <a class="mobile-menu__item" href="#" data-page="About">
          <div class="item-left">
            <span class="item-num">02</span>
            <span class="item-label">About</span>
          </div>
          <svg
            class="item-arrow"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 4l4 4-4 4" />
          </svg>
        </a>
        <a class="mobile-menu__item" href="#" data-page="Skills">
          <div class="item-left">
            <span class="item-num">03</span>
            <span class="item-label">Skills</span>
          </div>
          <svg
            class="item-arrow"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 4l4 4-4 4" />
          </svg>
        </a>
        <a class="mobile-menu__item" href="#" data-page="Portfolio">
          <div class="item-left">
            <span class="item-num">04</span>
            <span class="item-label">Portfolio</span>
          </div>
          <svg
            class="item-arrow"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 4l4 4-4 4" />
          </svg>
        </a>
        <a class="mobile-menu__item" href="#" data-page="Kontak">
          <div class="item-left">
            <span class="item-num">05</span>
            <span class="item-label">Kontak</span>
          </div>
          <svg
            class="item-arrow"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 4l4 4-4 4" />
          </svg>
        </a>
      </div>
    </nav>
  </div>
  <!-- =====================================================
       AKHIR NAVBAR
       ===================================================== -->

  <div class="demo-content">
    <div class="active-page" id="activePage">Home</div>
    <p>
      Ini area konten portofoliomu. Navbar di atas bersifat sticky — ia akan
      tetap di atas saat kamu scroll.
    </p>
  </div>

  <!-- Toggle simulasi untuk demo ini -->
  <div
    style="
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 0.5px solid var(--color-border-tertiary);
      background: var(--color-background-primary);
    "
  >
    <span
      style="
        font-size: 11px;
        color: var(--color-text-tertiary);
        align-self: center;
        font-family: var(--font-mono);
      "
      >simulasi:</span
    >
    <button
      onclick="setView('desktop')"
      id="btnDesktop"
      style="
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 0.5px solid var(--color-border-secondary);
        background: var(--color-text-primary);
        color: var(--color-background-primary);
        cursor: pointer;
      "
    >
      desktop
    </button>
    <button
      onclick="setView('mobile')"
      id="btnMobile"
      style="
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 0.5px solid var(--color-border-secondary);
        background: transparent;
        color: var(--color-text-secondary);
        cursor: pointer;
      "
    >
      mobile
    </button>
  </div>
</div>

<script>
  const wrapper = document.getElementById("navWrapper");
  const btn = document.getElementById("hamburgerBtn");
  const activePg = document.getElementById("activePage");
  const demoWrap = document.getElementById("demoWrap");

  function setOpen(open) {
    wrapper.classList.toggle("is-open", open);
    btn.setAttribute("aria-expanded", open);
  }

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    setOpen(!wrapper.classList.contains("is-open"));
  });

  document.addEventListener("click", (e) => {
    if (!wrapper.contains(e.target)) setOpen(false);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") setOpen(false);
  });

  /* Active state — desktop */
  document.querySelectorAll(".nav-links a").forEach((link) => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      document
        .querySelectorAll(".nav-links a")
        .forEach((l) => l.classList.remove("active"));
      link.classList.add("active");
      activePg.textContent = link.dataset.page;
    });
  });

  /* Active state — mobile */
  document.querySelectorAll(".mobile-menu__item").forEach((item) => {
    item.addEventListener("click", (e) => {
      e.preventDefault();
      document
        .querySelectorAll(".mobile-menu__item")
        .forEach((i) => i.classList.remove("active"));
      item.classList.add("active");
      activePg.textContent = item.dataset.page;
      setOpen(false);
    });
  });

  /* Simulasi view untuk demo */
  function setView(v) {
    const btnD = document.getElementById("btnDesktop");
    const btnM = document.getElementById("btnMobile");
    if (v === "mobile") {
      demoWrap.classList.add("view-mobile");
      btnM.style.background = "var(--color-text-primary)";
      btnM.style.color = "var(--color-background-primary)";
      btnD.style.background = "transparent";
      btnD.style.color = "var(--color-text-secondary)";
    } else {
      demoWrap.classList.remove("view-mobile");
      setOpen(false);
      btnD.style.background = "var(--color-text-primary)";
      btnD.style.color = "var(--color-background-primary)";
      btnM.style.background = "transparent";
      btnM.style.color = "var(--color-text-secondary)";
    }
  }
</script>
